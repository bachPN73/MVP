  <!-- Dynamic Google Search Structured Data (JSON-LD) & OG Image -->
  <script>
    (function() {
      const origin = window.location.origin;
      
      // Dynamic JSON-LD Organization Schema for Google Search
      const script = document.createElement('script');
      script.type = 'application/ld+json';
      script.text = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Edu Tech",
        "url": origin,
        "logo": origin + "/logo.png"
      });
      document.head.appendChild(script);

      // Dynamic Meta tags requiring absolute URLs
      const metaOgImage = document.createElement('meta');
      metaOgImage.setAttribute('property', 'og:image');
      metaOgImage.setAttribute('content', origin + '/logo.png');
      document.head.appendChild(metaOgImage);

      const metaTwitterImage = document.createElement('meta');
      metaTwitterImage.setAttribute('name', 'twitter:image');
      metaTwitterImage.setAttribute('content', origin + '/logo.png');
      document.head.appendChild(metaTwitterImage);
      
      const metaOgUrl = document.createElement('meta');
      metaOgUrl.setAttribute('property', 'og:url');
      metaOgUrl.setAttribute('content', origin);
      document.head.appendChild(metaOgUrl);
    })();
  </script>
