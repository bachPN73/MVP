services:
  - type: web
    name: edu-tech-mvp-backend
    runtime: node
    plan: free
    buildCommand: "npm install" # Render automatically detects package.json and installs
    startCommand: "node server/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard
      - key: FRONTEND_URL
        sync: false # Set in Render Dashboard (Vercel URL)
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
